# defaults.yaml

# Data
data:
  data_dir: "/mnt/data_lab513/adni/sMRI/processed/data/"
  feature_csv_path: "/home/minhtri/Molecular_AD/data/pool_raw.csv"
  cache_dir: "/home/minhtri/Molecular_AD/output/cache"
  batch_size: 32
  num_workers: 8

# Model
model:
  name: "beta_tc_vae"
  z_dim: 128
  in_channels: 1
  cluster_projection_dim: 32

# Training
training:
  max_epochs: 100
  lr: 0.0002
  optimizer: "adamw"
  weight_decay: 1.0e-2
  scheduler: "cosine"
  checkpoint_dir: "../checkpoints/"
  log_dir: "../logs/"
  dci_every_n_epochs: 1
  top_k: 30
  estimate_c_every: 0
  estimate_c_warmup: 5
  estimate_c_until: 40

# Loss
loss:
  type: "beta_tc_vae"
  recon_weight: 1.0
  kl_weight: 1.0e-3
  prediction_weight: 1.0
  cluster_weight: 1.0
  n_clusters: 2
  tc_weight: 1.0
  queue_size: 8
  queue_warmup: 4
  recon_scale: 0.1575
  pred_scale: 0.9945
  cluster_scale: 1.1391
  tc_scale: 2.8851
# Metrics
metrics:
  dci_alpha: 0.1

# Transform
transform:
  target_shape: [96, 96, 96]
  margin: 5