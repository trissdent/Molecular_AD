# defaults.yaml
# Shared settings for every experiment. Per-experiment overrides live in
# configs/smri.yaml, configs/dti.yaml, configs/both.yaml (passed with --exp).

# Data (everything here is produced by preprocessing/)
data:
  modality: smri                    # smri | dti | both (set by the override file)
  prepared_dir: "/home/minhtri/Molecular_AD/data/prepared"   # cohort, split, features, etiv
  cache_dirs:
    smri: "/mnt/data_lab513/molecular_mri/cache_smri"
    dti: "/mnt/data_lab513/molecular_mri/cache_dti"
  batch_size: 32
  num_workers: 8

# Model (in_channels follows the modality: 1, or 2 for both)
model:
  name: "beta_tc_vae"
  z_dim: 128
  cluster_projection_dim: 32
  input_size: 96                    # must match volumes.target_shape in preprocessing

# Training
training:
  seed: 42                          # training randomness (weights, batch order); the split has its own seed
  max_epochs: 70
  lr: 0.0002
  optimizer: "adamw"
  weight_decay: 1.0e-2
  scheduler: "cosine"
  checkpoint_dir: "../checkpoints/"
  log_dir: "../logs/"
  dci_every_n_epochs: 1
  top_k: 30
  estimate_c_every: 0
  estimate_c_warmup: 5
  estimate_c_until: 40
  cimlr_mode: full                  # full | off | fixed (off / fixed are the ablations)
  cluster_age_adjust: false         # true: CIMLR clusters latents with the CN aging trend removed
  checkpoint_monitor: val_pred      # best epoch = lowest val prediction error on the active features

# Loss (scales bring each term to a similar size; weights set their importance)
loss:
  type: "beta_tc_vae"
  recon_weight: 1.0
  kl_weight: 1.0e-3
  prediction_weight: 1.0
  cluster_weight: 1.0
  n_clusters: 2
  tc_weight: 1.0
  queue_size: 8
  queue_warmup: 4
  recon_scale: 0.1575
  pred_scale: 0.9945
  cluster_scale: 1.1391
  tc_scale: 2.8851

# Metrics
metrics:
  dci_alpha: 0.1